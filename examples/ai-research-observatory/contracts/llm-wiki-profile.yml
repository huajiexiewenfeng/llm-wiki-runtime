profile:
  id: ai-research-observatory
  version: v0.1
  display_name: AI Research Observatory Memory
  scope_type: research_workspace
  privacy_default: sensitive_local

layout:
  directories:
    - domains/ai-research-observatory/directions
    - sources/originals/ai-research-observatory
    - logs

write_rules:
  records:
    research_direction_revision:
      path: domains/ai-research-observatory/directions/{direction_id}/revisions/{revision}.md
      mode: create_only
      required_vars: [direction_id, revision]
      required_refs: [source_id]

read_rules:
  context_pack:
    include: [domains/ai-research-observatory/**]
    exclude: [sources/originals/**, .meta/**]
    max_files: 12
    max_chars_per_file: 8000
  record_lookup:
    research_direction_revision:
      identity_field: record_id
      display_field: title
      match_fields: [record_id]
      return_fields: [record_id, title, direction_id, revision, promotion_id]
      max_results: 1

logs:
  types:
    observatory_memory_event:
      path: logs/ai-research-observatory-memory-event.jsonl
      mode: append_only
