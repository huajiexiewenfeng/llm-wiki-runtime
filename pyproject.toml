[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-runtime"
version = "0.2.0"
description = "Local LLM Wiki runtime and access layer for AI skills."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
llm-wiki = "llm_wiki_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["llm_wiki_runtime*"]

[tool.setuptools.package-data]
llm_wiki_runtime = ["assets/graph/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["performance: scale and workstation performance budgets"]
